<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>AzurImmo | Appartements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --azur-primary: #0061ff; --azur-dark: #1a1a2e; }
        body { font-family: 'Montserrat', sans-serif; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; padding: 40px 0; }
        .dashboard-container { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); padding: 30px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        h2 { color: var(--azur-primary); font-weight: 700; text-transform: uppercase; margin: 0; }
        .table thead { background-color: var(--azur-dark); color: white; }
        .icon-circle { width: 40px; height: 40px; background: #fff3e0; color: #ff9800; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .info-badge { background: #e3f2fd; color: #0d47a1; font-weight: 700; padding: 5px 15px; border-radius: 15px; }
    </style>
</head>
<body>
<div class="container">
    <nav class="mb-4 text-center">
        <a href="locataire.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Locataires</a>
        <a href="batiment.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Bâtiments</a>
        <a href="appartement.html" class="btn btn-sm btn-primary rounded-pill px-3">Appartements</a>
        <a href="contrat.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Contrats</a>
        <a href="intervention.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Interventions</a>
        <a href="loyer.html" class="btn btn-sm btn-outline-primary rounded-pill px-3">Loyers</a>
    </nav>

    <div class="dashboard-container">
        <div class="header-section">
            <h2><i class="fa-solid fa-door-open me-3"></i>Appartements</h2>
            <div class="d-flex gap-2">
                <input type="text" id="villeSearch" class="form-control form-control-sm rounded-pill" placeholder="Filtrer par ville...">
                <button onclick="chargerAppartements(document.getElementById('villeSearch').value)" class="btn btn-outline-primary btn-sm rounded-pill px-3">Filtrer</button>
                <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#modalAddAppart">
                    <i class="fa-solid fa-plus me-1"></i>Ajouter
                </button>
            </div>
        </div>
        
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Réf</th>
                        <th>Numéro</th>
                        <th>Surface</th>
                        <th>Pièces</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="appartement-table">
                    <tr><td colspan="5" class="text-center py-4 text-muted">Chargement en cours...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalAddAppart" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-primary">Nouvel Appartement</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="formAppart">
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Numéro d'appartement</label>
                            <input type="number" id="addNumero" class="form-control rounded-3" placeholder="Ex: 101" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Surface (m²)</label>
                            <input type="number" id="addSurface" class="form-control rounded-3" step="0.1" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label small fw-bold">Nombre de pièces</label>
                            <input type="number" id="addPieces" class="form-control rounded-3" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalDetailsAppart" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
            <div class="modal-header bg-primary text-white" style="border-radius: 20px 20px 0 0;">
                <h5 class="modal-title fw-bold"><i class="fa-solid fa-circle-info me-2"></i>Fiche Technique</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4 text-center">
                <div class="icon-circle mx-auto mb-2" style="width: 60px; height: 60px; font-size: 1.5rem;" id="detId"></div>
                <h4 class="fw-bold mb-4" id="detNumero"></h4>
                <div class="row text-start g-3">
                    <div class="col-6 border-end text-center">
                        <small class="text-muted d-block text-uppercase small">Surface</small>
                        <span class="fw-bold" id="detSurface"></span>
                    </div>
                    <div class="col-6 text-center">
                        <small class="text-muted d-block text-uppercase small">Composition</small>
                        <span class="info-badge d-inline-block mt-1" id="detPieces"></span>
                    </div>
                    <div class="col-12 mt-3 border-top pt-2 text-start">
                        <small class="text-muted d-block text-uppercase small">Localisation du Bâtiment</small>
                        <span class="fw-bold text-primary" id="detBatiment">Non rattaché</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-outline-primary rounded-pill px-4" data-bs-dismiss="modal">Fermer</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = '/api/appartements';

    function chargerAppartements(ville = "") {
        let url = API_BASE;
        if(ville) url = `${API_BASE}/ville/${ville}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const tableBody = document.getElementById('appartement-table');
                tableBody.innerHTML = "";
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="text-center py-4">Aucun résultat trouvé.</td></tr>`;
                    return;
                }
                data.forEach(app => {
                    tableBody.innerHTML += `
                        <tr>
                            <td><div class="icon-circle fw-bold">${app.id}</div></td>
                            <td><div class="fw-bold">Appartement n°${app.numero || 'N/A'}</div></td>
                            <td><span class="badge bg-info text-dark">${app.surface || '0'} m²</span></td>
                            <td><span class="info-badge">${app.nombrePieces || '0'} pièces</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="voirDetails(${app.id})">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="supprimer(${app.id})">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            })
            .catch(err => {
                console.error("Erreur :", err);
                document.getElementById('appartement-table').innerHTML = `<tr><td colspan="5" class="text-center text-danger">Erreur serveur.</td></tr>`;
            });
    }

    function voirDetails(id) {
        // CORRECTION : On utilise /id/ pour correspondre au Controller Java
        fetch(`${API_BASE}/id/${id}`)
            .then(res => {
                if(!res.ok) throw new Error();
                return res.json();
            })
            .then(app => {
                document.getElementById('detId').innerText = app.id;
                document.getElementById('detNumero').innerText = `Logement n°${app.numero}`;
                document.getElementById('detSurface').innerText = `${app.surface} m²`;
                document.getElementById('detPieces').innerText = `${app.nombrePieces} pièces`;
                
                // Affichage des infos du bâtiment
                if(app.batiment) {
                    document.getElementById('detBatiment').innerText = `${app.batiment.adresse}, ${app.batiment.ville}`;
                } else {
                    document.getElementById('detBatiment').innerText = "Non rattaché";
                }

                new bootstrap.Modal(document.getElementById('modalDetailsAppart')).show();
            })
            .catch(err => alert("Impossible de charger les détails. Vérifiez que l'ID existe."));
    }

    document.getElementById('formAppart').addEventListener('submit', function(e) {
        e.preventDefault();
        const body = {
            numero: document.getElementById('addNumero').value,
            surface: document.getElementById('addSurface').value,
            nombrePieces: document.getElementById('addPieces').value
        };
        fetch(`${API_BASE}/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        }).then(res => {
            if(res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('modalAddAppart')).hide();
                document.getElementById('formAppart').reset();
                chargerAppartements();
            } else {
                alert("Erreur lors de l'enregistrement.");
            }
        });
    });

    function supprimer(id) {
        if(confirm("Confirmer la suppression ?")) {
            fetch(`${API_BASE}/${id}`, { method: 'DELETE' })
                .then(res => {
                    if(res.ok) chargerAppartements();
                    else alert("Erreur lors de la suppression.");
                });
        }
    }

    window.onload = () => chargerAppartements();
</script>
</body>
</html>
